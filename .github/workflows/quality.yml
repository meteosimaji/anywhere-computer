name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shared-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.8"
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check src tests scripts
      - run: uv run mypy
      - run: openssl version
      - run: uv run pytest -ra tests/test_startup_native.py --junitxml="${{ runner.temp }}/pytest-native.xml"
      - run: uv run pytest -ra --ignore=tests/test_startup_native.py --junitxml="${{ runner.temp }}/pytest-results.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results-${{ matrix.os }}
          path: ${{ runner.temp }}/pytest-*.xml
          if-no-files-found: ignore
          retention-days: 14
      - run: uv run python scripts/verify_tunnel_pipe.py --download-for-test
      - run: uv build
      - name: Build portable distribution
        run: uv run python scripts/build_portable.py --allow-downloads --output dist/portable-${{ matrix.os }}.zip
      - name: Extract and verify relocated portable runtime
        shell: bash
        run: |
          uv run python - <<'PY'
          import os
          import zipfile
          from pathlib import Path
          archive = Path('dist/portable-${{ matrix.os }}.zip')
          destination = Path('dist/relocation 日本語')
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(destination)
              if os.name != 'nt':
                  for member in bundle.infolist():
                      (destination / member.filename).chmod((member.external_attr >> 16) & 0o777)
          PY
          uv run python scripts/verify_portable.py 'dist/relocation 日本語/Anywhere Computer' --runtime-only
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: dist/portable-${{ matrix.os }}.zip
          if-no-files-found: error
          retention-days: 14
