name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  management-preview:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record desktop build toolchain
        run: rustc --version --verbose
      - name: Check desktop formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml -- --check
      - name: Verify desktop host
        run: cargo test --locked --manifest-path desktop/Cargo.toml
      - name: Build native preview
        run: cargo build --locked --manifest-path desktop/Cargo.toml
      - name: Retain native preview for isolated application acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: management-preview-${{ matrix.os }}
          path: |
            desktop/target/debug/anywhere-computer-manager
            desktop/target/debug/anywhere-computer-manager.exe
          if-no-files-found: error
          retention-days: 7
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.8"
      - name: Select managed Python for packaging
        run: uv sync --locked --managed-python --python 3.12
      - name: Package native manager with the existing runtime
        shell: bash
        run: |
          uv run python - <<'PYCODE'
          import os
          import subprocess
          import sys
          import zipfile
          from pathlib import Path
          native = Path('desktop/target/debug/anywhere-computer-manager' +
                        ('.exe' if os.name == 'nt' else '')).resolve()
          archive = Path('dist/managed-portable.zip')
          helpers = []
          if sys.platform == 'darwin':
              gui = Path('dist/anywhere-gui').resolve()
              gui.parent.mkdir(exist_ok=True)
              subprocess.run(['swiftc', 'native/macos/AXHelper.swift', '-o', str(gui)], check=True)
              helpers = ['--gui-helper', str(gui)]
          subprocess.run([sys.executable, 'scripts/build_portable.py',
                          '--allow-downloads', '--manager', str(native),
                          '--output', str(archive), *helpers], check=True)
          destination = Path('dist/managed relocation 日本語')
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(destination)
              if os.name != 'nt':
                  for member in bundle.infolist():
                      (destination / member.filename).chmod((member.external_attr >> 16) & 0o777)
          subprocess.run([sys.executable, 'scripts/verify_portable.py',
                          str(destination / 'Anywhere Computer'), '--runtime-only'], check=True)
          PYCODE
      - name: Retain combined package for isolated GUI acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: managed-portable-${{ matrix.os }}
          path: dist/managed-portable.zip
          if-no-files-found: error
          retention-days: 7
  windows-feature-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.8"
      - run: uv sync --locked --managed-python --python 3.12
      - name: Check Windows issue boundaries before the full matrix completes
        run: >-
          uv run pytest -q tests/test_delegated_files.py tests/test_delegated_tasks.py
          tests/test_peer_mcp.py tests/test_ssh_client.py tests/test_subchat_device_save.py
          tests/test_subchat_queue_auto.py tests/test_subchat_setup.py
          tests/test_subchat_upload_state.py tests/test_uploads_windows.py
          tests/test_engine_selection.py
  shared-runtime:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.8"
      - run: uv sync --locked --managed-python --python 3.12
      - name: Record selected runtime
        run: uv run python -c "import sys; print(sys.executable); print(sys.base_prefix)"
      - name: Check generated README references and local links
        run: uv run python scripts/update_readme.py --check
      - run: uv run ruff check src tests scripts
      - run: uv run mypy
      - run: openssl version
      - name: Check Node runtime and workspace recovery before parallel workers
        run: |
          node --version
          uv run pytest -v tests/test_workspace_ui.py::test_workspace_mutation_recovery_in_javascript --junitxml="${{ runner.temp }}/pytest-workspace.xml"
      - run: uv run pytest -ra tests/test_startup_native.py --junitxml="${{ runner.temp }}/pytest-native.xml"
      - name: Check terminal ownership and continuous work before the full suite
        run: >-
          uv run pytest -v tests/test_terminal_children.py
          tests/test_terminal_pty.py tests/test_terminal_conpty.py
          tests/test_file_search_terminal_workflow.py
      - name: Check shared-agent recovery before parallel workers
        run: uv run pytest -v tests/test_shared_agent_reconnect.py --junitxml="${{ runner.temp }}/pytest-reconnect.xml"
      - name: Run remaining suite with bounded Windows parallelism
        run: >-
          uv run pytest -ra --ignore=tests/test_startup_native.py --durations=20
          --ignore=tests/test_shared_agent_reconnect.py
          --ignore=tests/test_terminal_children.py
          --ignore=tests/test_terminal_pty.py
          --ignore=tests/test_terminal_conpty.py
          --ignore=tests/test_file_search_terminal_workflow.py
          --deselect=tests/test_workspace_ui.py::test_workspace_mutation_recovery_in_javascript
          ${{ runner.os == 'Windows' && '-n 2 --dist loadfile --max-worker-restart=0' || '' }}
          --junitxml="${{ runner.temp }}/pytest-results.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pytest-results-${{ matrix.os }}
          path: ${{ runner.temp }}/pytest-*.xml
          if-no-files-found: ignore
          retention-days: 14
      - run: uv run python scripts/verify_tunnel_pipe.py --download-for-test
      - run: uv build
      - name: Build portable distribution
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            mkdir -p dist
            swiftc native/macos/AXHelper.swift -o dist/anywhere-gui
            uv run python scripts/build_portable.py --allow-downloads \
              --gui-helper "$(pwd)/dist/anywhere-gui" \
              --output dist/portable-${{ matrix.os }}.zip
          else
            uv run python scripts/build_portable.py --allow-downloads \
              --output dist/portable-${{ matrix.os }}.zip
          fi
      - name: Extract and verify relocated portable runtime
        shell: bash
        run: |
          uv run python - <<'PY'
          import os
          import zipfile
          from pathlib import Path
          archive = Path('dist/portable-${{ matrix.os }}.zip')
          destination = Path('dist/relocation 日本語')
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(destination)
              if os.name != 'nt':
                  for member in bundle.infolist():
                      (destination / member.filename).chmod((member.external_attr >> 16) & 0o777)
          PY
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            uv run python scripts/verify_portable.py 'dist/relocation 日本語/Anywhere Computer'
          else
            uv run python scripts/verify_portable.py 'dist/relocation 日本語/Anywhere Computer' --runtime-only
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              test -x 'dist/relocation 日本語/Anywhere Computer/native/anywhere-gui'
            fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-${{ matrix.os }}
          path: dist/portable-${{ matrix.os }}.zip
          if-no-files-found: error
          retention-days: 14
  attest-portable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: shared-runtime
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portable-${{ matrix.os }}
          path: dist
      - name: Attest the verified portable archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/portable-${{ matrix.os }}.zip
          create-storage-record: false
      - name: Verify portable provenance identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify dist/portable-${{ matrix.os }}.zip
          --repo meteosimaji/anywhere-computer
          --signer-workflow meteosimaji/anywhere-computer/.github/workflows/quality.yml
          --source-digest ${{ github.sha }}
          --source-ref refs/heads/main
          --deny-self-hosted-runners
  attest-managed-portable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: management-preview
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: managed-portable-${{ matrix.os }}
          path: dist
      - name: Attest the verified managed portable archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/managed-portable.zip
          create-storage-record: false
      - name: Verify managed portable provenance identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify dist/managed-portable.zip
          --repo meteosimaji/anywhere-computer
          --signer-workflow meteosimaji/anywhere-computer/.github/workflows/quality.yml
          --source-digest ${{ github.sha }}
          --source-ref refs/heads/main
          --deny-self-hosted-runners
  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [management-preview, windows-feature-smoke, shared-runtime,
            attest-portable, attest-managed-portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select a new clean version or an unfinished draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$(python3 scripts/assemble_release_assets.py --version)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          draft="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$draft" == false ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
            --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$existing_ref" && "$existing_ref" != "$GITHUB_SHA" ]]; then
            echo "Release tag already points at another commit" >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
      - name: Download verified portable archives
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: portable-*
          path: release-input
      - name: Download verified managed archives
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: managed-portable-*
          path: release-input
      - name: Assemble versioned assets and verify provenance
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(python3 scripts/assemble_release_assets.py \
            --incoming release-input --output release-assets)" == "${{ steps.release.outputs.tag }}"
          for asset in release-assets/*.zip; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/quality.yml" \
              --source-digest "$GITHUB_SHA" --source-ref refs/heads/main \
              --deny-self-hosted-runners
          done
      - name: Upload and publish the complete release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EXISTING_DRAFT: ${{ steps.release.outputs.draft }}
        shell: bash
        run: |
          prerelease=false
          if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease=true
          fi
          if [[ "$EXISTING_DRAFT" == true ]]; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" --draft --prerelease="$prerelease" \
              --title "Anywhere Computer ${RELEASE_TAG#v}" \
              --notes "Build from $GITHUB_SHA. Quality run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Live service and hardware acceptance are separate." \
              --generate-notes
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          release = json.loads(Path('release.json').read_text())
          expected = {}
          for path in Path('release-assets').iterdir():
              with path.open('rb') as stream:
                  expected[path.name] = ('sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest(),
                                         path.stat().st_size)
          actual = {asset['name']: (asset['digest'], asset['size'])
                    for asset in release['assets']}
          if release['draft'] is not True or actual != expected:
              raise SystemExit('Draft release assets do not match the verified CI files')
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" == false
