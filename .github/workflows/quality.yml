name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shared-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.8"
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check src tests scripts
      - run: uv run mypy
      - run: openssl version
      - run: uv run pytest -ra tests/test_startup_native.py --junitxml="${{ runner.temp }}/pytest-native.xml"
      - run: uv run pytest -ra --ignore=tests/test_startup_native.py --junitxml="${{ runner.temp }}/pytest-results.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results-${{ matrix.os }}
          path: ${{ runner.temp }}/pytest-*.xml
          if-no-files-found: ignore
          retention-days: 14
      - run: uv run python scripts/verify_tunnel_pipe.py --download-for-test
      - run: uv build
