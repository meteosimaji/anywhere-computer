[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "anywhere-computer"
dynamic = ["version"]
description = "Your computer, available through a dependable MCP connection."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.11,<3",
    "psutil>=7,<8",
    "keyring>=25,<26",
    "pywinpty==3.0.5 ; sys_platform == 'win32'",
]

[project.scripts]
anywhere = "anywhere_computer.cli:main"
anywhere-subchat = "anywhere_computer.subchat_cli:main"

[project.optional-dependencies]
relay = [
    "PyJWT[crypto]==2.13.0",
    "websockets==17.0.1",
]
browser = [
    "playwright==1.58.0",
]
mcp = [
    "mcp==1.30.0",
]

[dependency-groups]
dev = [
    "websockets==17.0.1",
    "mcp>=1.12,<2",
    "pytest>=8",
    "pytest-asyncio>=1",
    "mypy>=1.15",
    "ruff>=0.11",
    "types-psutil>=7",
    "build>=1",
    "pytest-xdist>=3.8,<4",
    "playwright==1.58.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/anywhere_computer"]

[tool.hatch.version]
path = "src/anywhere_computer/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/native", "/tests", "/plugins", "/scripts", "/pyproject.toml", "/uv.lock", "/README.md", "/README.ja.md", "/CHANGELOG.md", "/LICENSE", "/docs", "/.github/workflows/quality.yml"]
