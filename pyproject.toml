[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "anywhere-computer"
version = "0.1.0a1"
description = "Your computer, available through a dependable MCP connection."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mcp>=1.12,<2", "pydantic>=2.11,<3", "psutil>=7,<8", "keyring>=25,<26"]

[project.scripts]
anywhere = "anywhere_computer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "mypy>=1.15", "ruff>=0.11", "types-psutil>=7", "build>=1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/anywhere_computer"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/docs/ARCHITECTURE.md"]
